      - "mikazuki/parameter_routing.py"
      - "mikazuki/model_component_profiles.py"
      - "mikazuki/sd3_full_bf16_scope.py"
      - "tools/parameter_policy_backend_feature_gpu_support.py"
      - "scripts/dev/sd3_train_network.py"
      - "scripts/dev/train_network.py"
      - "scripts/dev/library/sd3_forward_contract.py"
      - "scripts/dev/library/sd3_resume_cursor.py"
      - "scripts/dev/library/train_util.py"
      - "scripts/dev/networks/lora_sd3.py"
      - "scripts/dev/networks/lora_flux.py"
      - "scripts/dev/library/sd3_utils.py"
      - "scripts/dev/library/sd3_models.py"
      - "scripts/dev/library/config_util.py"
      - "scripts/dev/library/dts_parameter_policy_bridge.py"
