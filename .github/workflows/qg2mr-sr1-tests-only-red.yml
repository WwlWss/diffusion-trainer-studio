name: DTS QG-2-MR-SR1 26 actual pre-merge source defects Tests-only RED
on:
  push:
    branches: ["feature/qualification-gate-qg1b3-qg2-admission-red"]
    paths:
      - ".github/workflows/qg2mr-sr1-tests-only-red.yml"
      - "tests/test_parameter_policy_qg2mr_sr1_red.py"
      - "tests/test_parameter_policy_qg2b2_cli_intent.py"
      - "tests/test_parameter_policy_admission_red.py"
      - "tests/qg2b4i_ci_contract.py"
      - "mikazuki/direct_trainer_admission_intent.py"
      - "scripts/stable/train_network.py"
      - "scripts/dev/train_network.py"
      - "scripts/stable/sdxl_train_network.py"
      - "scripts/dev/sdxl_train_network.py"
      - "scripts/dev/sd3_train_network.py"
      - "scripts/dev/flux_train_network.py"
      - "scripts/dev/lumina_train_network.py"
      - "scripts/stable/library/train_util.py"
      - "scripts/dev/library/train_util.py"
      - "scripts/stable/library/dts_parameter_policy_bridge.py"
      - "scripts/dev/library/dts_parameter_policy_bridge.py"
      - ".github/workflows/qg1b-trusted-producer-host.yml"
      - ".github/workflows/qg1b-sr1-host.yml"
  pull_request:
    paths:
      - ".github/workflows/qg2mr-sr1-tests-only-red.yml"
      - "tests/test_parameter_policy_qg2mr_sr1_red.py"
      - "tests/test_parameter_policy_qg2b2_cli_intent.py"
      - "tests/test_parameter_policy_admission_red.py"
      - "tests/qg2b4i_ci_contract.py"
      - "mikazuki/direct_trainer_admission_intent.py"
      - "scripts/stable/**"
      - "scripts/dev/**"
      - ".github/workflows/qg1b-trusted-producer-host.yml"
      - ".github/workflows/qg1b-sr1-host.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-source-tests:
    name: "MR-SR1 26 genuine source RED and 28 baselines (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile real extracted readers, subprocess checks and frozen B2 tests
        run: python -m py_compile tests/test_parameter_policy_qg2mr_sr1_red.py tests/test_parameter_policy_qg2b2_cli_intent.py tests/qg2b4i_ci_contract.py
      - name: Confirm four real independent MR-SR1 baselines PASS
        shell: bash
        run: |
          python - <<'PY'
          import unittest
          from tests.test_parameter_policy_qg2mr_sr1_red import QG2MRSR1Baselines
          suite = unittest.defaultTestLoader.loadTestsFromTestCase(QG2MRSR1Baselines)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if (result.testsRun != 4 or result.failures or result.errors or
              result.skipped or result.expectedFailures or result.unexpectedSuccesses):
              raise SystemExit("MR-SR1 invalid four genuine baselines")
          print("MR-SR1 BASELINES: 4/4 actual PASS")
          PY
      - name: Preserve prior eight QG2-B2 CLI tests unchanged
        shell: bash
        run: |
          python - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.loadTestsFromName("tests.test_parameter_policy_qg2b2_cli_intent")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if (result.testsRun != 8 or result.failures or result.errors or
              result.skipped or result.expectedFailures or result.unexpectedSuccesses):
              raise SystemExit("MR-SR1 frozen B2 regression: expected 8/8 real PASS")
          print("MR-SR1 INHERITED B2: 8/8 actual PASS")
          PY
      - name: Preserve cumulative B312 plus baseline sixteen actual GREEN
        shell: bash
        run: |
          python - <<'PY'
          from tests.qg2b4i_ci_contract import assert_cumulative_admission_green
          assert_cumulative_admission_green("QG-2-MR-SR1 frozen parent baseline")
          PY
      - name: Exactly 26 genuine MR-01 through MR-04 failures (Tests-only RED)
        shell: bash
        run: |
          python - <<'PY'
          import unittest
          from tests.test_parameter_policy_qg2mr_sr1_red import (
              QG2MRSR1Targeted, MARKER,
          )
          suite = unittest.defaultTestLoader.loadTestsFromTestCase(QG2MRSR1Targeted)
          if suite.countTestCases() != 26:
              raise SystemExit(f"MR-SR1 invalid target discovery: {suite.countTestCases()}")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          traces = [trace for _, trace in result.failures]
          if (result.testsRun != 26 or len(result.failures) != 26
              or any(MARKER not in trace for trace in traces)
              or result.errors or result.skipped or result.expectedFailures
              or result.unexpectedSuccesses):
              raise SystemExit(
                  f"MR-SR1 invalid source RED: {len(result.failures)} failures "
                  f"{len(result.errors)} errors, {len(result.skipped)} skips"
              )
          print("MR-SR1 VALID TESTS-ONLY RED: 26/26 real source defects; "
                "4/4 MR baselines + 8/8 B2 + 16/16 B312 genuinely PASS")
          raise SystemExit(1)
          PY
