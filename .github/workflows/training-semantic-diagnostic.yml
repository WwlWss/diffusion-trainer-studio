name: Training semantic diagnostic

on:
  pull_request:
    paths:
      - "mikazuki/training_*.py"
      - "tests/test_training_semantic_contract.py"
      - ".github/workflows/training-semantic-diagnostic.yml"

jobs:
  semantic-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Import raw GUI compiler
        run: python -c "import mikazuki.training_gui_args; print('training_gui_args ok')"
      - name: Import rehydrate
        if: always()
        run: python -c "import mikazuki.training_rehydrate; print('training_rehydrate ok')"
      - name: Import semantic normalizer
        if: always()
        run: python -c "import mikazuki.training_gui_semantics; print('training_gui_semantics ok')"
      - name: Import effective config pipeline
        if: always()
        run: python -c "import mikazuki.training_config; print('training_config ok')"
      - name: Import semantic contract module
        if: always()
        run: python -c "import tests.test_training_semantic_contract; print('semantic contract module ok')"
