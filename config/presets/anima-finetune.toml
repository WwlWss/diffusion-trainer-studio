[metadata]
name = "Anima 全参微调"
version = "1.1"
author = "WwlWss"
train_type = "flux-lora"
description = "使用新版 kohya-ss/sd-scripts 的 anima_train.py 对标准 28-block Anima DiT 做全参微调；默认冻结 Qwen3 文本编码器。"

[data]
model_type = "anima"
anima_model_variant = "base"
anima_training_mode = "finetune"
anima_finetune_learning_rate = "1e-5"
optimizer_type = "AdamW8bit"
lr_scheduler = "constant"
timestep_sampling = "sigmoid"
sigmoid_scale = 1.0
discrete_flow_shift = 1.0
anima_precision_mode = "full_bf16"
anima_checkpoint_mode = "standard"
anima_latent_cache_mode = "disk"
anima_text_encoder_cache_mode = "disk"
save_precision = "bf16"
vae_chunk_size = 64
vae_disable_cache = true
qwen_image_vae_2d = true
attn_mode = "torch"
split_attn = false
blocks_to_swap = 0
qwen3_max_token_length = 512
t5_max_token_length = 512
