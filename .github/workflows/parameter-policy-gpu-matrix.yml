name: Parameter Policy GPU matrix

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Self-hosted runner label with a CUDA GPU"
        required: true
        default: "gpu"
      execution_gate_mode:
        description: "Shared C1-C4 gate mode"
        required: true
        type: choice
        options:
          - d0-promotion
          - regression
        default: d0-promotion
      backend_manifest:
        description: "Optional machine-local JSON manifest for the legacy all-backend regression matrix"
        required: false
        default: ""
      backend_feature_manifest:
        description: "Optional machine-local JSON manifest for Phase D backend-feature cases"
        required: false
        default: ""

jobs:
  gpu-matrix:
    runs-on:
      - self-hosted
      - ${{ github.event_name == 'workflow_dispatch' && inputs.runner || 'gpu' }}
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python on non-Windows runners
        if: runner.os != 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show CUDA runtime
        run: nvidia-smi

      - name: Create evidence directory on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $evidenceDir = Join-Path $env:RUNNER_TEMP "dts-parameter-policy-evidence"
          Remove-Item -Recurse -Force -Path $evidenceDir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $evidenceDir | Out-Null
          "DTS_EVIDENCE_DIR=$evidenceDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create evidence directory on non-Windows runners
        if: runner.os != 'Windows'
        run: |
          evidence_dir="$RUNNER_TEMP/dts-parameter-policy-evidence"
          rm -rf "$evidence_dir"
          mkdir -p "$evidence_dir"
          echo "DTS_EVIDENCE_DIR=$evidence_dir" >> "$GITHUB_ENV"

      - name: Select usable host Python on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item Env:PYTHONHOME -ErrorAction SilentlyContinue
          Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue

          $candidates = New-Object System.Collections.Generic.List[string]

          try {
            py -0p 2>$null | ForEach-Object {
              if ($_ -match '([A-Za-z]:\\.*python\.exe)\s*$') {
                $candidates.Add($Matches[1].Trim())
              }
            }
          } catch {}

          try {
            $pathPython = (Get-Command python.exe -ErrorAction Stop).Source
            if ($pathPython) {
              $candidates.Add($pathPython)
            }
          } catch {}

          $selected = $null
          foreach ($candidate in ($candidates | Select-Object -Unique)) {
            Write-Host "Probing Python: $candidate"
            & $candidate -c "import sys, ssl, pip; assert sys.version_info[:2] == (3, 11), sys.version; print(sys.version); print(ssl.OPENSSL_VERSION); print(pip.__version__)" 2>&1
            if ($LASTEXITCODE -eq 0) {
              $selected = $candidate
              break
            }
          }

          if (-not $selected) {
            throw "No Windows Python 3.11 with working ssl + pip was found. Install or repair Python 3.11 with OpenSSL support."
          }

          Write-Host "Selected Python: $selected"
          "DTS_PYTHON=$selected" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upgrade pip on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: '& $env:DTS_PYTHON -m pip install --upgrade pip'

      - name: Install production qualification dependencies on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: '& $env:DTS_PYTHON -m pip install torch==2.7.0 torchvision==0.22.0 -r requirements.txt'

      - name: Run strict C1-C4 execution qualification on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: '& $env:DTS_PYTHON tools/run_parameter_policy_execution_gpu_matrix.py --expected-commit "${{ github.sha }}" --qualification-mode "${{ inputs.execution_gate_mode }}" --output "$env:DTS_EVIDENCE_DIR/parameter-policy-execution-gpu-matrix.json"'

      - name: Run synthetic CUDA optimizer regression on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: '& $env:DTS_PYTHON tools/run_parameter_policy_gpu_matrix.py --output "$env:DTS_EVIDENCE_DIR/parameter-policy-gpu-matrix.json"'

      - name: Run legacy real backend regression on Windows
        if: runner.os == 'Windows' && inputs.backend_manifest != ''
        shell: powershell
        run: '& $env:DTS_PYTHON tools/run_parameter_policy_backend_gpu_matrix.py --manifest "${{ inputs.backend_manifest }}" --output "$env:DTS_EVIDENCE_DIR/parameter-policy-backend-gpu-matrix.json"'

      - name: Run backend feature qualification on Windows
        if: runner.os == 'Windows' && inputs.backend_feature_manifest != ''
        shell: powershell
        run: '& $env:DTS_PYTHON tools/run_parameter_policy_backend_feature_gpu_matrix.py --expected-commit "${{ github.sha }}" --manifest "${{ inputs.backend_feature_manifest }}" --output "$env:DTS_EVIDENCE_DIR/parameter-policy-backend-feature-gpu-matrix.json"'

      - name: Upgrade pip on non-Windows runners
        if: runner.os != 'Windows'
        run: python -m pip install --upgrade pip

      - name: Install production qualification dependencies on non-Windows runners
        if: runner.os != 'Windows'
        run: python -m pip install torch==2.7.0 torchvision==0.22.0 -r requirements.txt

      - name: Run strict C1-C4 execution qualification on non-Windows runners
        if: runner.os != 'Windows'
        run: python tools/run_parameter_policy_execution_gpu_matrix.py --expected-commit "${{ github.sha }}" --qualification-mode "${{ inputs.execution_gate_mode }}" --output "$DTS_EVIDENCE_DIR/parameter-policy-execution-gpu-matrix.json"

      - name: Run synthetic CUDA optimizer regression on non-Windows runners
        if: runner.os != 'Windows'
        run: python tools/run_parameter_policy_gpu_matrix.py --output "$DTS_EVIDENCE_DIR/parameter-policy-gpu-matrix.json"

      - name: Run legacy real backend regression on non-Windows runners
        if: runner.os != 'Windows' && inputs.backend_manifest != ''
        run: python tools/run_parameter_policy_backend_gpu_matrix.py --manifest "${{ inputs.backend_manifest }}" --output "$DTS_EVIDENCE_DIR/parameter-policy-backend-gpu-matrix.json"

      - name: Run backend feature qualification on non-Windows runners
        if: runner.os != 'Windows' && inputs.backend_feature_manifest != ''
        run: python tools/run_parameter_policy_backend_feature_gpu_matrix.py --expected-commit "${{ github.sha }}" --manifest "${{ inputs.backend_feature_manifest }}" --output "$DTS_EVIDENCE_DIR/parameter-policy-backend-feature-gpu-matrix.json"

      - name: Upload matrix evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parameter-policy-gpu-matrix
          path: ${{ runner.temp }}/dts-parameter-policy-evidence
          if-no-files-found: warn
