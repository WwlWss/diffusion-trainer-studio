permissions:
  contents: read

jobs:
  host-contract:
    name: "E2 integrated 36 GREEN and 8 actual baselines (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - name: Checkout exact source without submodules
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Setup Python 3.11 without runtime dependencies
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Print exact checkout and verify no Torch
        shell: bash
        run: |
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
          python -c "import importlib.util,sys; print(sys.version); assert importlib.util.find_spec('torch') is None"
      - name: Compile frozen integration and C1/C2/C3/C4 test infrastructure
        run: python -m py_compile tests/qg2mr_sr2_e2_contract.py tests/qg2mr_sr2_e2_runner.py tests/qg2mr_sr2_e2_c1_contract.py tests/qg2mr_sr2_e2_c2_contract.py tests/qg2mr_sr2_e2_c3_contract.py tests/qg2mr_sr2_e2_c4_contract.py
      - name: Strict integrated GREEN with all independent behavior and baseline suites
        run: python -m tests.qg2mr_sr2_e2_c4_contract green

  host-partition:
    name: "E2-C1 full Host partition parity and actual suite (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - name: Checkout exact source and recursive pinned submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Python 3.11 without runtime dependencies
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Setup Node for six real frontend tests
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Print exact checkout and verify no Torch
        shell: bash
        run: |
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
          python -c "import importlib.util,sys; print(sys.version); assert importlib.util.find_spec('torch') is None"
      - name: Execute actual full Host suite and independently compare legacy outcomes
        run: python -m tests.qg2mr_sr2_e2_c1_contract host

  r2-cpu:
    name: "E2-C2 actual 7+11 pinned R2 CPU and discovery parity (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - name: Checkout exact source without submodules
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Print exact checkout
        shell: bash
        run: |
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
      - name: Install actual pinned CPU Torch and runtime dependencies
        shell: bash
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.7.0"
          python -m pip install "accelerate==1.6.0" "numpy==1.26.4" "schedulefree==1.4" "pytorch-optimizer==3.10.0" "safetensors==0.4.5"
          python -m pip check
      - name: Execute exact seven original R2 Helper CPU tests
        run: python -m tests.qg2mr_sr2_e2_runner r2-cpu --suite helper
      - name: Execute exact eleven original R2 FSR CPU tests
        run: python -m tests.qg2mr_sr2_e2_runner r2-cpu --suite fsr
      - name: Compare full original discovery with both actual partitions in pinned CPU environment
        run: python -m tests.qg2mr_sr2_e2_c2_contract partition-parity
