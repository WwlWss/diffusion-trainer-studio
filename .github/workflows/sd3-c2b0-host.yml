permissions:
  contents: read

jobs:
  host-evidence:
    name: B0 Host tests only (NO CUDA qualification)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal Host decoding dependencies
        run: python -m pip install --disable-pip-version-check "numpy==1.26.4" "safetensors==0.4.5" "pillow==11.1.0"

      - name: Read real Gitlink checkout status without claiming runtime readiness
        run: python -c "from tools.prepare_sd3_full_bf16_cases import _source_submodule_inventory; print(_source_submodule_inventory())"

      - name: Compile B0 Host modules and RED tests
        run: python -m py_compile tools/sd3_full_bf16_evidence_support.py tools/prepare_sd3_full_bf16_cases.py tests/test_sd3_full_bf16_gpu_evidence.py tools/sd3_full_bf16_evidence_worker.py tests/test_sd3_full_bf16_worker.py tests/test_sd3_full_bf16_worker_c2.py

      - name: Run B0 Host GREEN-1 contracts
        run: python -m unittest tests.test_sd3_full_bf16_gpu_evidence -v

      - name: Run C1-C3 Host timeline validation (metadata, NO CUDA)
        run: python -m unittest tests.test_sd3_full_bf16_worker tests.test_sd3_full_bf16_worker_c3 -v

      - name: Run C2 Worker admission/lease GREEN (pure Host, NO CUDA)
        run: python -m unittest tests.test_sd3_full_bf16_worker_c2 -v

      - name: Re-run C2-A and mixed-BF16 R0 Host regression
        run: python -m unittest tests.test_sd3_full_bf16_scope tests.test_sd3_component_gpu_evidence -v


  accelerate-160-cpu:
    name: Pinned Accelerate 1.6.0 CPU save/load contract (NO CUDA)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned CPU Torch 2.7.0 / TorchVision 0.22.0
        run: python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu "torch==2.7.0" "torchvision==0.22.0"

      - name: Install pinned Accelerate and Host dependencies
        run: python -m pip install --disable-pip-version-check "accelerate==1.6.0" "safetensors==0.4.5" "numpy==1.26.4" "pillow==11.1.0" "transformers==4.54.1" "diffusers==0.32.1" "einops==0.7.0" "huggingface-hub==0.34.3" "pytorch-optimizer==3.10.0" "opencv-python-headless==4.10.0.84" "toml==0.10.2" "imagesize==1.4.1" "ftfy==6.3.1" "voluptuous==0.15.2"

      - name: Execute real CPU save/load and Scheduler identity tests
        run: python -m unittest tests.test_sd3_full_bf16_accelerate_cpu -v

      - name: Run C2 Worker pinned CPU parser and CUDA fail-closed tests
        run: python -m unittest tests.test_sd3_full_bf16_worker_c2_cpu -v

      - name: Run C1 prepared Observer interfaces (pinned CPU only)
        run: python -m unittest tests.test_sd3_full_bf16_worker_cpu -v

      - name: Run C3 real BF16 Muon/AdamW Step Probe and fingerprint tests (CPU diagnostic only)
        run: python -m unittest tests.test_sd3_full_bf16_worker_c3_cpu -v
      - name: Execute C3 Strict Review RED→GREEN physical negative controls (CPU only)
        run: python -m unittest tests.test_sd3_full_bf16_worker_c3_strict_cpu -v

      - name: Strict C3-F6 real CPU RED-to-GREEN (13 tests; ZERO SKIP)
        shell: bash
        run: |
          python - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.loadTestsFromName(
              "tests.test_sd3_full_bf16_worker_c3_f6_cpu"
          )
          discovered = suite.countTestCases()
          if discovered != 13:
              raise SystemExit(
                  f"C3-F6 strict test discovery drift: expected 13, found {discovered}"
              )
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if (result.testsRun != 13 or not result.wasSuccessful()
                  or result.skipped or result.expectedFailures
                  or result.unexpectedSuccesses):
              raise SystemExit(
                  "C3-F6 physical evidence suite invalid: "
                  f"run={result.testsRun} errors={len(result.errors)} "
                  f"failed={len(result.failures)} skipped={len(result.skipped)} "
                  f"expected_failures={len(result.expectedFailures)} "
                  f"unexpected_successes={len(result.unexpectedSuccesses)}"
              )
          print("C3-F6 PINNED REAL CPU GREEN: 13 PASS, 0 SKIP, 0 FAIL; NO CUDA QUALIFICATION")
          PY

      - name: Strict C3-F7 real pinned CPU semantic and continuity qualification (18 tests; ZERO SKIP)
