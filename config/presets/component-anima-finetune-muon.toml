[metadata]
name = "Component：Anima Full — DiT Muon + AdamW fallback"
version = "1.0"
author = "Diffusion Trainer Studio"
train_type = "anima-finetune"
description = "Anima Stage 1 示例：Self/Cross/MLP 使用 Muon + AdamW fallback；Modulation/Base/LLM Adapter 使用 AdamW；Qwen3 冻结。"

[data]
optimization_mode = "component"
anima_precision_mode = "mixed_bf16"
anima_checkpoint_mode = "standard"
train_qwen3_text_encoder = false
fused_backward_pass = false
blocks_to_swap = 0
deepspeed = false
torch_compile = false

[data.parameter_policy_profiles.muon]
type = "Muon"

[data.parameter_policy_profiles.muon.args]
momentum = 0.95
weight_decay = 0.01
weight_decouple = true
nesterov = true
ns_steps = 5
ns_coeffs = "original"
use_adjusted_lr = false

[data.parameter_policy_profiles.adamw]
type = "AdamW"

[data.parameter_policy_profiles.adamw.args]
betas = [0.9, 0.95]
eps = 1e-8
weight_decay = 0.0

[data.parameter_policy_components."dit.self_attention"]
train = true
optimizer_profile = "muon"
learning_rate = "1e-4"
fallback_optimizer_profile = "adamw"
fallback_learning_rate = "2.5e-5"

[data.parameter_policy_components."dit.cross_attention"]
train = true
optimizer_profile = "muon"
learning_rate = "1e-4"
fallback_optimizer_profile = "adamw"
fallback_learning_rate = "2.5e-5"

[data.parameter_policy_components."dit.mlp"]
train = true
optimizer_profile = "muon"
learning_rate = "1e-4"
fallback_optimizer_profile = "adamw"
fallback_learning_rate = "2.5e-5"

[data.parameter_policy_components."dit.modulation"]
train = true
optimizer_profile = "adamw"
learning_rate = "2.5e-5"

[data.parameter_policy_components."dit.llm_adapter"]
train = true
optimizer_profile = "adamw"
learning_rate = "2e-6"

[data.parameter_policy_components."dit.base_other"]
train = true
optimizer_profile = "adamw"
learning_rate = "2.5e-5"

[data.parameter_policy_components.qwen3]
train = false
