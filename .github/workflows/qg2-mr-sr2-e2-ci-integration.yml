name: DTS QG-2-MR-SR2-E2-C1 Host partition scoped GREEN and remaining RED (NO CUDA)

on:
  push:
    branches:
      - "feature/qg2-mr-fsr-pr69-sr2b-ci-deps-red"
    paths:
      - ".github/workflows/qg2-mr-sr2-e2-ci-integration.yml"
      - "tests/qg2mr_sr2_e2_contract.py"
      - "tests/qg2mr_sr2_e2_runner.py"
      - "tests/qg2mr_sr2_e2_c1_contract.py"
      - ".github/workflows/anima-qwen3-review.yml"
      - "docs/qualification-gate-qg2-mr-sr2-e2-c1-host-partition.md"
      - "docs/qualification-gate-qg2-mr-sr2-e2-ci-integration-contract.md"
  pull_request:
    paths:
      - ".github/workflows/qg2-mr-sr2-e2-ci-integration.yml"
      - "tests/qg2mr_sr2_e2_contract.py"
      - "tests/qg2mr_sr2_e2_runner.py"
      - "tests/qg2mr_sr2_e2_c1_contract.py"
      - ".github/workflows/anima-qwen3-review.yml"
      - "docs/qualification-gate-qg2-mr-sr2-e2-c1-host-partition.md"
      - "docs/qualification-gate-qg2-mr-sr2-e2-ci-integration-contract.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-contract:
    name: "E2-C1 one GREEN 35 retained RED and 8 actual baselines (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - name: Checkout actual C1 candidate without submodules
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Setup Python 3.11 without runtime dependencies
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Print exact checkout and verify no Torch
        shell: bash
        run: |
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
          python -c "import importlib.util,sys; print(sys.version); assert importlib.util.find_spec('torch') is None"
      - name: Compile frozen integration and C1 test infrastructure
        run: python -m py_compile tests/qg2mr_sr2_e2_contract.py tests/qg2mr_sr2_e2_runner.py tests/qg2mr_sr2_e2_c1_contract.py
      - name: Exact C1 partition GREEN and 35 retained RED with independent baselines
        run: python -m tests.qg2mr_sr2_e2_c1_contract stage

  host-partition:
    name: "E2-C1 full Host partition parity and actual suite (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - name: Checkout exact source and recursive pinned submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Python 3.11 without runtime dependencies
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Setup Node for six real frontend tests
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Print exact checkout and verify no Torch
        shell: bash
        run: |
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
          python -c "import importlib.util,sys; print(sys.version); assert importlib.util.find_spec('torch') is None"
      - name: Execute actual full Host suite and independently compare legacy outcomes
        run: python -m tests.qg2mr_sr2_e2_c1_contract host
