        run: python -m pip install --disable-pip-version-check "accelerate==1.6.0" "safetensors==0.4.5" "numpy==1.26.4" "pillow==11.1.0" "transformers==4.54.1" "diffusers==0.32.1" "einops==0.7.0" "huggingface-hub==0.34.3" "pytorch-optimizer==3.10.0" "opencv-python-headless==4.10.0.84" "toml==0.10.2" "imagesize==1.4.1" "ftfy==6.3.1" "voluptuous==0.15.2"

      - name: Execute real CPU save/load and Scheduler identity tests
        run: python -m unittest tests.test_sd3_full_bf16_accelerate_cpu -v

      - name: Run C2 Worker pinned CPU parser and CUDA fail-closed tests
        run: python -m unittest tests.test_sd3_full_bf16_worker_c2_cpu -v

      - name: Run C1 prepared Observer interfaces (pinned CPU only)
        run: python -m unittest tests.test_sd3_full_bf16_worker_cpu -v

      - name: Run C3 real BF16 Muon/AdamW Step Probe and fingerprint tests (CPU diagnostic only)
