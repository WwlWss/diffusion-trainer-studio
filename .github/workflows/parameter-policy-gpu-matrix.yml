name: Parameter Policy GPU matrix

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Self-hosted runner label with a CUDA GPU"
        required: true
        default: "gpu"

jobs:
  gpu-matrix:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned Component runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            torch==2.7.0 torchvision==0.22.0 \
            accelerate==1.6.0 \
            bitsandbytes==0.46.0 \
            lion-pytorch==0.2.3 \
            schedulefree==1.4 \
            pytorch-optimizer==3.10.0

      - name: Run real CUDA matrix
        run: |
          python tools/run_parameter_policy_gpu_matrix.py \
            --output parameter-policy-gpu-matrix.json

      - name: Upload matrix evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parameter-policy-gpu-matrix
          path: parameter-policy-gpu-matrix.json
          if-no-files-found: error
