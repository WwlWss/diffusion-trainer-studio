name: DTS QG-2-MR-SR1-B nine Import Bootstrap GREEN and seventeen pending RED
on:
  push:
    branches: ["feature/qualification-gate-qg1b3-qg2-admission-red"]
    paths:
      - ".github/workflows/qg2mr-sr1-tests-only-red.yml"
      - "tests/test_parameter_policy_qg2mr_sr1_red.py"
      - "tests/test_parameter_policy_qg2b2_cli_intent.py"
      - "tests/test_parameter_policy_admission_red.py"
      - "tests/qg2b4i_ci_contract.py"
      - "mikazuki/direct_trainer_admission_intent.py"
      - "scripts/stable/train_network.py"
      - "scripts/dev/train_network.py"
      - "scripts/stable/sdxl_train_network.py"
      - "scripts/dev/sdxl_train_network.py"
      - "scripts/dev/sd3_train_network.py"
      - "scripts/dev/flux_train_network.py"
      - "scripts/dev/lumina_train_network.py"
      - "scripts/stable/library/train_util.py"
      - "scripts/dev/library/train_util.py"
      - "scripts/stable/library/dts_parameter_policy_bridge.py"
      - "scripts/dev/library/dts_parameter_policy_bridge.py"
      - ".github/workflows/qg1b-trusted-producer-host.yml"
      - ".github/workflows/qg1b-sr1-host.yml"
  pull_request:
    paths:
      - ".github/workflows/qg2mr-sr1-tests-only-red.yml"
      - "tests/test_parameter_policy_qg2mr_sr1_red.py"
      - "tests/test_parameter_policy_qg2b2_cli_intent.py"
      - "tests/test_parameter_policy_admission_red.py"
      - "tests/qg2b4i_ci_contract.py"
      - "mikazuki/direct_trainer_admission_intent.py"
      - "scripts/stable/**"
      - "scripts/dev/**"
      - ".github/workflows/qg1b-trusted-producer-host.yml"
      - ".github/workflows/qg1b-sr1-host.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-source-tests:
    name: "MR-SR1-B nine actual Bootstrap GREEN plus baselines (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile real extracted readers, subprocess checks and frozen B2 tests
        run: python -m py_compile tests/test_parameter_policy_qg2mr_sr1_red.py tests/test_parameter_policy_qg2b2_cli_intent.py tests/qg2b4i_ci_contract.py
      - name: Confirm four real independent MR-SR1 baselines PASS
        shell: bash
        run: |
          python - <<'PY'
          import unittest
          from tests.test_parameter_policy_qg2mr_sr1_red import QG2MRSR1Baselines
          suite = unittest.defaultTestLoader.loadTestsFromTestCase(QG2MRSR1Baselines)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if (result.testsRun != 4 or result.failures or result.errors or
              result.skipped or result.expectedFailures or result.unexpectedSuccesses):
              raise SystemExit("MR-SR1 invalid four genuine baselines")
          print("MR-SR1 BASELINES: 4/4 actual PASS")
          PY
      - name: Preserve eight QG2-B2 CLI contracts with updated safe Bridge source expectations
        shell: bash
        run: |
          python - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.loadTestsFromName("tests.test_parameter_policy_qg2b2_cli_intent")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if (result.testsRun != 8 or result.failures or result.errors or
              result.skipped or result.expectedFailures or result.unexpectedSuccesses):
              raise SystemExit("MR-SR1 frozen B2 regression: expected 8/8 real PASS")
          print("MR-SR1 INHERITED B2: 8/8 actual PASS")
          PY
      - name: Preserve cumulative B312 plus baseline sixteen actual GREEN
        shell: bash
        run: |
          python - <<'PY'
          from tests.qg2b4i_ci_contract import assert_cumulative_admission_green
          assert_cumulative_admission_green("QG-2-MR-SR1 frozen parent baseline")
          PY
      - name: Exactly nine genuine MR-02 Bootstrap and Full Reader cold subprocess GREEN
        shell: bash
        run: |
          python - <<'PY'
          import unittest
          from tests.test_parameter_policy_qg2mr_sr1_red import QG2MRSR1Targeted
          all_names = sorted(n for n in dir(QG2MRSR1Targeted) if n.startswith("test_mr"))
          green_names = [n for n in all_names if n.startswith(("test_mr3", "test_mr4"))]
          red_names = [n for n in all_names if n not in green_names]
          if (len(all_names), len(green_names), len(red_names)) != (26, 9, 17):
              raise SystemExit("MR-SR1-B invalid independent target discovery")
          result = unittest.TextTestRunner(verbosity=2).run(
              unittest.TestSuite(QG2MRSR1Targeted(n) for n in green_names)
          )
          if (result.testsRun != 9 or result.failures or result.errors
              or result.skipped or result.expectedFailures or result.unexpectedSuccesses):
              raise SystemExit(
                  f"MR-SR1-B nine real GREEN tests NOT PASS: "
                  f"{len(result.failures)} FAIL; {len(result.errors)} ERROR"
              )
          print("MR-SR1-B VERIFIED IMPORT GREEN: 9/9 live Stable/Dev cold subprocess/source checks PASS")
          PY
  remaining-source-red:
    name: "MR-SR1-B seventeen independently preserved source RED (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Precisely seventeen MR-01 MR-03 MR-04 source defects remain real RED
        shell: bash
        run: |
          python - <<'PY'
          import unittest
          from tests.test_parameter_policy_qg2mr_sr1_red import (
              QG2MRSR1Targeted, MARKER,
          )
          all_names = sorted(n for n in dir(QG2MRSR1Targeted) if n.startswith("test_mr"))
          red_names = [n for n in all_names if not n.startswith(("test_mr3", "test_mr4"))]
          if len(all_names) != 26 or len(red_names) != 17:
              raise SystemExit("MR-SR1-B remaining target discovery drift")
          result = unittest.TextTestRunner(verbosity=2).run(
              unittest.TestSuite(QG2MRSR1Targeted(n) for n in red_names)
          )
          failures = [trace for _, trace in result.failures]
          if (result.testsRun != 17 or len(failures) != 17
              or any(MARKER not in trace for trace in failures)
              or result.errors or result.skipped or result.expectedFailures
              or result.unexpectedSuccesses):
              raise SystemExit(
                  f"MR-SR1-B invalid expected RED: {len(failures)} failures "
                  f"and {len(result.errors)} errors"
              )
          print("MR-SR1-B VERIFIED HOLD: MR-01 MR-03 MR-04 have 17/17 REAL RED; nine MR-02 GREEN isolated")
          raise SystemExit(1)
          PY
