name: DTS QG-2-B2 CLI Intent scoped GREEN with B312 held RED (NO CUDA)

on:
  push:
    branches:
      - "feature/qualification-gate-qg1b3-qg2-admission-red"
    paths:
      - ".github/workflows/qg2b2-cli-intent-host.yml"
      - "mikazuki/direct_trainer_admission_intent.py"
      - "scripts/stable/train_network.py"
      - "scripts/dev/train_network.py"
      - "scripts/stable/sdxl_train_network.py"
      - "scripts/dev/sdxl_train_network.py"
      - "scripts/dev/sd3_train_network.py"
      - "scripts/dev/flux_train_network.py"
      - "scripts/dev/lumina_train_network.py"
      - "scripts/stable/library/train_util.py"
      - "scripts/dev/library/train_util.py"
      - "tests/test_parameter_policy_qg2b2_cli_intent.py"
      - "tests/test_parameter_policy_admission_red.py"
      - "tests/test_parameter_policy_qg1b_trusted_producer.py"
      - "tests/test_parameter_policy_qg1b_sr1.py"
      - "tests/test_parameter_policy_qg1b_evidence_coverage.py"
  pull_request:
    paths:
      - ".github/workflows/qg2b2-cli-intent-host.yml"
      - "mikazuki/direct_trainer_admission_intent.py"
      - "scripts/stable/train_network.py"
      - "scripts/dev/train_network.py"
      - "scripts/stable/sdxl_train_network.py"
      - "scripts/dev/sdxl_train_network.py"
      - "scripts/dev/sd3_train_network.py"
      - "scripts/dev/flux_train_network.py"
      - "scripts/dev/lumina_train_network.py"
      - "scripts/stable/library/train_util.py"
      - "scripts/dev/library/train_util.py"
      - "tests/test_parameter_policy_qg2b2_cli_intent.py"
      - "tests/test_parameter_policy_admission_red.py"
      - "tests/test_parameter_policy_qg1b_trusted_producer.py"
      - "tests/test_parameter_policy_qg1b_sr1.py"
      - "tests/test_parameter_policy_qg1b_evidence_coverage.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cli-intent-host:
    name: "QG-2-B2 CLI intent GREEN + B312 one RED (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Exact checkout without optional submodules
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Use Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile B2 and all NetworkTrainer entrypoints
        run: python -m py_compile mikazuki/direct_trainer_admission_intent.py scripts/stable/train_network.py scripts/dev/train_network.py scripts/stable/sdxl_train_network.py scripts/dev/sdxl_train_network.py scripts/dev/sd3_train_network.py scripts/dev/flux_train_network.py scripts/dev/lumina_train_network.py tests/test_parameter_policy_qg2b2_cli_intent.py tests/test_parameter_policy_admission_red.py tests/test_parameter_policy_qg1b_trusted_producer.py tests/test_parameter_policy_qg1b_sr1.py tests/test_parameter_policy_qg1b_evidence_coverage.py
      - name: Preserve 42 prior QG-1B and SR1 host tests
        shell: bash
        run: |
          python - <<'PY'
          import unittest
          cases = [
              ("tests.test_parameter_policy_qg1b_trusted_producer", 16),
              ("tests.test_parameter_policy_qg1b_sr1", 16),
              ("tests.test_parameter_policy_qg1b_evidence_coverage", 10),
          ]
          for name, expected in cases:
              suite = unittest.defaultTestLoader.loadTestsFromName(name)
              if suite.countTestCases() != expected:
                  raise SystemExit(f"QG-2-B2 PRIOR DISCOVERY MISMATCH: {name}")
              result = unittest.TextTestRunner(verbosity=2).run(suite)
              if (result.testsRun != expected or result.errors or result.failures
                      or result.skipped or result.expectedFailures
                      or result.unexpectedSuccesses):
                  raise SystemExit(f"QG-2-B2 PRIOR GREEN REGRESSION: {name}")
          print("QG-2-B2 PRIOR 42/42 HOST GREEN; 0 FAIL/ERROR/SKIP/xfail/xpass")
          PY
      - name: Exact eight-case QG-2-B2 CLI Intent GREEN
        shell: bash
        run: |
          python - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.loadTestsFromName(
              "tests.test_parameter_policy_qg2b2_cli_intent"
          )
          if suite.countTestCases() != 8:
              raise SystemExit(
                  f"QG-2-B2 INVALID DISCOVERY: {suite.countTestCases()} != 8"
              )
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if (result.testsRun != 8 or result.errors or result.failures
                  or result.skipped or result.expectedFailures
                  or result.unexpectedSuccesses):
              raise SystemExit(
                  f"QG-2-B2 INVALID GREEN: tests={result.testsRun} "
                  f"FAIL={len(result.failures)} ERROR={len(result.errors)} "
                  f"SKIP={len(result.skipped)} xfail={len(result.expectedFailures)} "
                  f"xpass={len(result.unexpectedSuccesses)}"
              )
          print("QG-2-B2 CLI INTENT GREEN: 8/8 PASS; all seven NetworkTrainer entrypoints, "
                "Stable/Dev CLI, TOML rejection, output_config isolation")
          PY
      - name: Preserve exact B301-B311 GREEN and one B312 integration RED
        shell: bash
        run: |
          python - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.loadTestsFromName(
              "tests.test_parameter_policy_admission_red"
          )
          if suite.countTestCases() != 16:
              raise SystemExit(
                  f"QG-2-B2 INVALID CUMULATIVE DISCOVERY: {suite.countTestCases()} != 16"
              )
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if (result.testsRun != 16 or result.errors or result.skipped
                  or result.expectedFailures or result.unexpectedSuccesses):
              raise SystemExit(
                  f"QG-2-B2 INVALID CUMULATIVE RUN: tests={result.testsRun} "
                  f"ERROR={len(result.errors)} SKIP={len(result.skipped)} "
                  f"xfail={len(result.expectedFailures)} "
                  f"xpass={len(result.unexpectedSuccesses)}"
              )
          expected = {
              "test_b312_direct_trainer_uses_same_admission_and_explicit_cli_intent",
          }
          actual = {case.id().rsplit(".", 1)[-1] for case, _ in result.failures}
          unrelated = [
              case.id() for case, trace in result.failures
              if "QG-1B3-QG2 ADMISSION CONTRACT ABSENT" not in trace
          ]
          if len(result.failures) != 1 or actual != expected or unrelated:
              raise SystemExit(
                  f"QG-2-B2 INVALID B312 RED: actual={sorted(actual)} "
                  f"unrelated={unrelated}"
              )
          print("QG-2-B2 SCOPED GREEN + B312 HOLD: B301-B311 11 PASS, "
                "B901-B904 4 PASS, exactly one B312 RED; "
                "0 ERROR/SKIP/xfail/xpass; no execution authorization")
          raise SystemExit(1)
          PY
