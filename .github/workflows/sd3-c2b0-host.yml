permissions:
  contents: read

jobs:
  host-evidence:
    name: B0 Host tests only (NO CUDA qualification)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal Host decoding dependencies
        run: python -m pip install --disable-pip-version-check "numpy==1.26.4" "safetensors==0.4.5" "pillow==11.1.0"

      - name: Read real Gitlink checkout status without claiming runtime readiness
        run: python -c "from tools.prepare_sd3_full_bf16_cases import _source_submodule_inventory; print(_source_submodule_inventory())"

      - name: Compile B0 Host modules and RED tests
        run: python -m py_compile tools/sd3_full_bf16_evidence_support.py tools/prepare_sd3_full_bf16_cases.py tests/test_sd3_full_bf16_gpu_evidence.py tools/sd3_full_bf16_evidence_worker.py tests/test_sd3_full_bf16_worker.py tests/test_sd3_full_bf16_worker_c2.py

      - name: Run B0 Host GREEN-1 contracts
        run: python -m unittest tests.test_sd3_full_bf16_gpu_evidence -v

      - name: Run C1-C3 Host timeline validation (metadata, NO CUDA)
        run: python -m unittest tests.test_sd3_full_bf16_worker tests.test_sd3_full_bf16_worker_c3 -v

      - name: Run C2 Worker admission/lease GREEN (pure Host, NO CUDA)
        run: python -m unittest tests.test_sd3_full_bf16_worker_c2 -v

      - name: Compile C4-A Pure Host metadata tests (8 discovered, NO CUDA)
        run: python -m py_compile tests/test_sd3_full_bf16_worker_c4a_host.py

      - name: C4-A Pure Host exact discovery and metadata-only gate (8; ZERO SKIP)
        shell: bash
        run: |
          python - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.loadTestsFromName(
              "tests.test_sd3_full_bf16_worker_c4a_host"
          )
          discovered = suite.countTestCases()
          if discovered != 8:
              raise SystemExit(f"C4-A INVALID HOST DISCOVERY: {discovered} != 8")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if (result.testsRun != 8 or result.failures or result.errors
                  or result.skipped or result.expectedFailures
                  or result.unexpectedSuccesses):
              raise SystemExit(
                  "C4-A INVALID HOST: "
                  f"run={result.testsRun}, failures={len(result.failures)}, "
                  f"errors={len(result.errors)}, skip={len(result.skipped)}, "
                  f"xfail={len(result.expectedFailures)}, "
                  f"xpass={len(result.unexpectedSuccesses)}"
              )
          print("C4-A HOST METADATA BASELINE: 8 PASS / 0 ERROR / 0 SKIP; NOT CUDA")
          PY

      - name: Compile C4-C pure Host loaded-parent timeline RED
        run: python -m py_compile tests/test_sd3_full_bf16_worker_c4c_host.py

      - name: C4-C Host exact 8 metadata-parent RED to GREEN (NO CUDA)
        shell: bash
        run: |
          python - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.loadTestsFromName("tests.test_sd3_full_bf16_worker_c4c_host")
          discovered = suite.countTestCases()
          if discovered != 8: raise SystemExit(f"C4-C HOST INVALID DISCOVERY: {discovered} != 8")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if (result.testsRun != 8 or result.errors or result.skipped
                  or result.expectedFailures or result.unexpectedSuccesses):
              raise SystemExit(f"C4-C HOST INVALID RUN: ERROR={len(result.errors)}, SKIP={len(result.skipped)}")
          if result.failures:
              unrelated = [t.id() for t, tb in result.failures if "C4-C HOST CONTRACT ABSENT" not in tb]
              if unrelated: raise SystemExit(f"C4-C HOST INVALID RED unrelated: {unrelated}")
              print(f"C4-C HOST VALID RED: {len(result.failures)} targeted FAIL, {8-len(result.failures)} baseline PASS; 0 ERROR/SKIP")
              raise SystemExit(1)
          print("C4-C HOST GREEN: 8 PASS, 0 FAIL/ERROR/SKIP/xfail/xpass; NOT CUDA")
          PY

      - name: Re-run C2-A and mixed-BF16 R0 Host regression
        run: python -m unittest tests.test_sd3_full_bf16_scope tests.test_sd3_component_gpu_evidence -v


