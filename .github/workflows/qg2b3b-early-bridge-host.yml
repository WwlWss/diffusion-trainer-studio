name: DTS QG-2-B3-B Stable Dev Early Bridge Tests-only RED (NO CUDA)
on:
  push:
    branches: ["feature/qualification-gate-qg1b3-qg2-admission-red"]
    paths:
      - ".github/workflows/qg2b3b-early-bridge-host.yml"
      - "docs/qualification-gate-qg2b3b-early-bridge-tests-only-red.md"
      - "tests/test_parameter_policy_qg2b3b_early_bridge_red.py"
      - "tests/test_parameter_policy_qg2b3a_snapshot_red.py"
      - "tests/test_parameter_policy_admission_red.py"
      - "scripts/stable/train_network.py"
      - "scripts/dev/train_network.py"
      - "scripts/stable/library/dts_parameter_policy_bridge.py"
      - "scripts/dev/library/dts_parameter_policy_bridge.py"
      - "mikazuki/parameter_policy_admission.py"
  pull_request:
    paths:
      - ".github/workflows/qg2b3b-early-bridge-host.yml"
      - "docs/qualification-gate-qg2b3b-early-bridge-tests-only-red.md"
      - "tests/test_parameter_policy_qg2b3b_early_bridge_red.py"
      - "scripts/stable/train_network.py"
      - "scripts/dev/train_network.py"
      - "scripts/stable/library/dts_parameter_policy_bridge.py"
      - "scripts/dev/library/dts_parameter_policy_bridge.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  b3b-exact-red:
    name: B3-B exact RED and baselines
    runs-on: ${{ matrix.os }}
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout exact source without submodules
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile inherited and target harness
        run: python -m py_compile tests/test_parameter_policy_qg2b3b_early_bridge_red.py tests/test_parameter_policy_qg2b3a_snapshot_red.py tests/test_parameter_policy_qg2b2_cli_intent.py tests/test_parameter_policy_admission_red.py tests/test_parameter_policy_qg1b_trusted_producer.py tests/test_parameter_policy_qg1b_sr1.py tests/test_parameter_policy_qg1b_evidence_coverage.py
      - name: Exact inherited GREEN plus cumulative B312 RED
        shell: bash
        run: |
          python - <<'PY'
          import unittest
          green = [
              ("tests.test_parameter_policy_qg1b_trusted_producer", 16),
              ("tests.test_parameter_policy_qg1b_sr1", 16),
              ("tests.test_parameter_policy_qg1b_evidence_coverage", 10),
              ("tests.test_parameter_policy_qg2b2_cli_intent", 8),
              ("tests.test_parameter_policy_qg2b3a_snapshot_red", 12),
          ]
          for name, expected in green:
              suite = unittest.defaultTestLoader.loadTestsFromName(name)
              if suite.countTestCases() != expected:
                  raise SystemExit(f"B3B INVALID PRIOR DISCOVERY {name}")
              result = unittest.TextTestRunner(verbosity=2).run(suite)
              if (result.testsRun != expected or result.failures or result.errors
                      or result.skipped or result.expectedFailures or result.unexpectedSuccesses):
                  raise SystemExit(f"B3B PRIOR GREEN REGRESSION {name}")
          suite = unittest.defaultTestLoader.loadTestsFromName("tests.test_parameter_policy_admission_red")
          if suite.countTestCases() != 16:
              raise SystemExit("B3B INVALID CUMULATIVE DISCOVERY")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          failures = {case.id().rsplit(".", 1)[-1]: trace for case, trace in result.failures}
          expected = "test_b312_direct_trainer_uses_same_admission_and_explicit_cli_intent"
          if (result.testsRun != 16 or result.errors or result.skipped
                  or result.expectedFailures or result.unexpectedSuccesses
                  or len(failures) != 1 or expected not in failures
                  or "QG-1B3-QG2 ADMISSION CONTRACT ABSENT" not in failures[expected]):
              raise SystemExit(f"B3B INVALID CUMULATIVE RED: {list(failures)}")
          print("B3B PRIOR: QG-1B/SR1 42 PASS; B2 8 PASS; B3-A 12 PASS; B301-B311 and B901-B904 15 PASS; B312 one expected RED")
          PY
      - name: Exact B3-B eight RED and four real baselines
        shell: bash
        run: |
          python - <<'PY'
          import unittest
          from tests.test_parameter_policy_qg2b3b_early_bridge_red import (
              QG2B3BEarlyBridgeTargetedRed, QG2B3BEarlyBridgeBaselines, MARKER,
          )
          targeted = sorted(n for n in dir(QG2B3BEarlyBridgeTargetedRed) if n.startswith("test_b3b2"))
          baselines = sorted(n for n in dir(QG2B3BEarlyBridgeBaselines) if n.startswith("test_b3b9"))
          if len(targeted) != 8 or len(baselines) != 4:
              raise SystemExit(f"B3B INVALID DISCOVERY {len(targeted)}+{len(baselines)}")
          for n in range(201, 209):
              if sum(name.startswith(f"test_b3b{n}_") for name in targeted) != 1:
                  raise SystemExit(f"B3B INVALID TARGET B3B{n}")
          for n in range(901, 905):
              if sum(name.startswith(f"test_b3b{n}_") for name in baselines) != 1:
                  raise SystemExit(f"B3B INVALID BASELINE B3B{n}")
          a = unittest.TextTestRunner(verbosity=2).run(unittest.TestSuite(QG2B3BEarlyBridgeTargetedRed(n) for n in targeted))
          b = unittest.TextTestRunner(verbosity=2).run(unittest.TestSuite(QG2B3BEarlyBridgeBaselines(n) for n in baselines))
          if (a.testsRun != 8 or b.testsRun != 4 or a.errors or b.errors or a.skipped or b.skipped
                  or a.expectedFailures or b.expectedFailures or a.unexpectedSuccesses
                  or b.unexpectedSuccesses or b.failures):
              raise SystemExit("B3B INVALID TEST EXECUTION")
          ids = {case.id().rsplit(".", 1)[-1] for case, trace in a.failures}
          bad = [case.id() for case, trace in a.failures if MARKER not in trace]
          if len(a.failures) == 8 and ids == set(targeted) and not bad:
              print("QG-2-B3-B VALID TESTS-ONLY RED: B3B201-B3B208 8 exact FAIL + B3B901-B3B904 4 genuine PASS; 0 ERROR/SKIP/xfail/xpass")
              raise SystemExit(1)
          if a.failures:
              raise SystemExit(f"B3B INVALID FAILURE IDENTITIES {ids}, wrong marker {bad}")
          print("QG-2-B3-B GREEN CANDIDATE: not an implementation signoff; B3-C and B312 HOLD")
          PY
