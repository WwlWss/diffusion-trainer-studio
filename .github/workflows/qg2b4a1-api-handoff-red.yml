name: DTS QG-2-B4-A1 API to Launcher one-job Handoff scoped GREEN
on:
  push:
    branches:
      - main
      - "feature/qualification-gate-qg1b3-qg2-admission-red"
    paths:
      - ".github/workflows/qg2b4a1-api-handoff-red.yml"
      - "docs/qualification-gate-qg2b4a1-api-handoff-tests-only-red.md"
      - "tests/test_parameter_policy_qg2b4a1_api_handoff_red.py"
      - "mikazuki/app/training_api.py"
      - "mikazuki/training_launcher.py"
      - "tests/test_parameter_policy_admission_red.py"
      - "tests/test_parameter_policy_qg1b_evidence_coverage.py"
      - "tests/test_parameter_policy_qg1b_sr1.py"
      - "tests/test_parameter_policy_qg1b_trusted_producer.py"
      - "tests/test_parameter_policy_qg2b2_cli_intent.py"
      - "tests/test_parameter_policy_qg2b3a_snapshot_red.py"
      - "tests/test_parameter_policy_qg2b3b_early_bridge_red.py"
      - "tests/test_parameter_policy_qg2b3b_sr1_dynamic_host_red.py"
      - "tests/test_parameter_policy_qg2b3c_late_dynamic_host.py"
      - "tests/test_parameter_policy_qg2b3c_late_session_red.py"
      - "tests/test_parameter_policy_qg2b3c_sr1_preapply_host.py"
      - "tests/test_parameter_policy_qg2b3c_sr1_red.py"
      - "tests/test_parameter_policy_qg2b4_0_b312_rebase.py"
      - "tests/test_parameter_policy_qg2b4l1_launcher_red.py"
      - "tests/test_parameter_policy_qg2a2_api_red.py"
      - "mikazuki/training_config.py"
      - "mikazuki/direct_trainer_admission_intent.py"
      - "mikazuki/parameter_policy_admission.py"
      - "scripts/stable/train_network.py"
  pull_request:
    paths:
      - ".github/workflows/qg2b4a1-api-handoff-red.yml"
      - "docs/qualification-gate-qg2b4a1-api-handoff-tests-only-red.md"
      - "tests/test_parameter_policy_qg2b4a1_api_handoff_red.py"
      - "mikazuki/app/training_api.py"
      - "mikazuki/training_launcher.py"
      - "tests/test_parameter_policy_admission_red.py"
      - "tests/test_parameter_policy_qg1b_evidence_coverage.py"
      - "tests/test_parameter_policy_qg1b_sr1.py"
      - "tests/test_parameter_policy_qg1b_trusted_producer.py"
      - "tests/test_parameter_policy_qg2b2_cli_intent.py"
      - "tests/test_parameter_policy_qg2b3a_snapshot_red.py"
      - "tests/test_parameter_policy_qg2b3b_early_bridge_red.py"
      - "tests/test_parameter_policy_qg2b3b_sr1_dynamic_host_red.py"
      - "tests/test_parameter_policy_qg2b3c_late_dynamic_host.py"
      - "tests/test_parameter_policy_qg2b3c_late_session_red.py"
      - "tests/test_parameter_policy_qg2b3c_sr1_preapply_host.py"
      - "tests/test_parameter_policy_qg2b3c_sr1_red.py"
      - "tests/test_parameter_policy_qg2b4_0_b312_rebase.py"
      - "tests/test_parameter_policy_qg2b4l1_launcher_red.py"
      - "tests/test_parameter_policy_qg2a2_api_red.py"
      - "mikazuki/training_config.py"
      - "mikazuki/direct_trainer_admission_intent.py"
      - "mikazuki/parameter_policy_admission.py"
      - "scripts/stable/train_network.py"
  workflow_dispatch:

permissions:
  contents: read
jobs:
  b4a1-exact-red:
    name: "B4-A1 API 8 GREEN, 6 baseline PASS, B312 cumulative GREEN (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile actual API source, Launcher and new/previous Host contracts
        run: python -m py_compile mikazuki/app/training_api.py mikazuki/training_launcher.py tests/test_parameter_policy_qg2b4a1_api_handoff_red.py tests/test_parameter_policy_qg2b4l1_launcher_red.py tests/test_parameter_policy_admission_red.py
      - name: Assert inherited 116, B4-0 six and B4-L2 fourteen real PASS
        shell: bash
        run: |
          python - <<'PY'
          import unittest

          suites = (
              ("tests.test_parameter_policy_qg1b_trusted_producer", 16),
              ("tests.test_parameter_policy_qg1b_sr1", 16),
              ("tests.test_parameter_policy_qg1b_evidence_coverage", 10),
              ("tests.test_parameter_policy_qg2b2_cli_intent", 8),
              ("tests.test_parameter_policy_qg2b3a_snapshot_red", 12),
              ("tests.test_parameter_policy_qg2b3b_early_bridge_red", 12),
              ("tests.test_parameter_policy_qg2b3b_sr1_dynamic_host_red", 8),
              ("tests.test_parameter_policy_qg2b3c_late_session_red", 10),
              ("tests.test_parameter_policy_qg2b3c_late_dynamic_host", 8),
              ("tests.test_parameter_policy_qg2b3c_sr1_red", 11),
              ("tests.test_parameter_policy_qg2b3c_sr1_preapply_host", 5),
              ("tests.test_parameter_policy_qg2b4_0_b312_rebase", 6),
              ("tests.test_parameter_policy_qg2b4l1_launcher_red", 14),
          )
          total = 0
          for name, expected in suites:
              suite = unittest.defaultTestLoader.loadTestsFromName(name)
              if suite.countTestCases() != expected:
                  raise SystemExit(f"B4-A1 INHERITED DISCOVERY ERROR: {name} {suite.countTestCases()}")
              result = unittest.TextTestRunner(verbosity=1).run(suite)
              if (result.testsRun != expected or result.errors or result.failures or
                  result.skipped or result.expectedFailures or result.unexpectedSuccesses):
                  raise SystemExit(f"B4-A1 INHERITED REGRESSION: {name}")
              total += expected
          if total != 136:
              raise SystemExit(f"B4-A1 WRONG INHERITED TOTAL: {total}")
          print("B4-A1 PRIOR HOST 116/116 + B4-0 6/6 + B4-L2 14/14 GREEN")
          PY
      - name: All cumulative 16 first-party Admission cases truly PASS
        shell: bash
        run: |
          python - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.loadTestsFromName(
              "tests.test_parameter_policy_admission_red")
          if suite.countTestCases() != 16:
              raise SystemExit(f"B4-A1 INVALID CUMULATIVE DISCOVERY {suite.countTestCases()}")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if (result.testsRun != 16 or result.failures or result.errors or
              result.skipped or result.expectedFailures or result.unexpectedSuccesses):
              raise SystemExit("B4-A1 CUMULATIVE REGRESSION: B301-B312 + B901-B904 MUST BE 16 PASS")
          print("B4-A1 cumulative 16/16 GREEN including real B312 API-to-Launcher handoff")
          PY
      - name: Six actual existing API / Launcher baseline PASS
        shell: bash
        run: |
          python - <<'PY'
          import unittest
          from tests.test_parameter_policy_qg2b4a1_api_handoff_red import QG2B4A1ApiHandoffBaselines
          names = sorted(n for n in dir(QG2B4A1ApiHandoffBaselines) if n.startswith("test_b4a90"))
          if len(names) != 6 or any(sum(n.startswith(f"test_b4a{i}_") for n in names) != 1 for i in range(901,907)):
              raise SystemExit(f"B4-A1 INVALID SIX BASELINE DISCOVERY: {names}")
          result = unittest.TextTestRunner(verbosity=2).run(
              unittest.TestSuite(QG2B4A1ApiHandoffBaselines(n) for n in names))
          if (result.testsRun != 6 or result.errors or result.failures or
              result.skipped or result.expectedFailures or result.unexpectedSuccesses):
              raise SystemExit("B4-A1 INVALID BASELINE: must be six real PASS")
          print("B4-A1 API baseline B4A901-B4A906 SIX REAL PASS")
          PY
      - name: Eight exact real API-to-Launcher Handoff tests GREEN
        shell: bash
        run: |
          python - <<'PY'
          import unittest
          from tests.test_parameter_policy_qg2b4a1_api_handoff_red import QG2B4A1ApiHandoffRed
          names = sorted(n for n in dir(QG2B4A1ApiHandoffRed) if n.startswith("test_b4a10"))
          if len(names) != 8 or any(sum(n.startswith(f"test_b4a{i}_") for n in names) != 1 for i in range(101,109)):
              raise SystemExit(f"B4-A1 INVALID EIGHT TARGET DISCOVERY: {names}")
          suite = unittest.TestSuite(QG2B4A1ApiHandoffRed(n) for n in names)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if (result.testsRun != 8 or result.failures or result.errors or
              result.skipped or result.expectedFailures or result.unexpectedSuccesses):
              raise SystemExit("B4-A1 TARGET REGRESSION: ALL EIGHT REAL HANDOFF CASES MUST PASS")
          print("QG-2-B4-A1 SCOPED GREEN: 8/8 real API Handoff PASS + 6/6 baseline PASS; inherited 136/136 PASS; cumulative B312 16/16 PASS; no ERROR/SKIP/xfail/xpass")
          PY
